<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSense — Smart Inventory & Point of Sale</title>
    
    <!-- Pengalihan otomatis jika user menekan index.html langsung dari File Explorer -->
    <script>
        if (window.location.protocol === 'file:') {
            window.location.replace('http://localhost:8000');
        }
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts & Dependencies (Wajib ada react-is untuk React 18) -->
    <script crossorigin src="https://unpkg.com/prop-types@15.7.2/prop-types.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-is@18.2.0/umd/react-is.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

    <!-- SheetJS (xlsx) untuk Export Dataset Excel (.xlsx) Asli -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css?v=5.0">

    <!-- Konfigurasi Global, Bunyi Scanner "Tiiit!", Kompresi Base64 200KB, & Print Struk 58mm -->
    <script src="js/config.js?v=5.0"></script>
</head>
<body>
    <div id="root"></div>

    <!-- Komponen Reusable (Dengan Cache-Buster v=5.0) -->
    <script type="text/babel" src="js/components/Icons.js?v=5.0"></script>
    <script type="text/babel" src="js/components/UI.js?v=5.0"></script>
    <script type="text/babel" src="js/components/IntroSplash.js?v=5.0"></script>

    <!-- Halaman-Halaman Aplikasi (10 Halaman Lengkap) -->
    <script type="text/babel" src="js/pages/DashboardPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/ProductsPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/SalesEntryPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/PredictionPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/RestockPOPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/HistoryPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/UploadCenterPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/GuideSupportPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/SubscriptionPage.js?v=5.1"></script>
    <script type="text/babel" src="js/pages/SettingsPage.js?v=5.1"></script>

    <!-- Aplikasi Utama & Mounting Root -->
    <script type="text/babel" src="js/App.js?v=5.1"></script>

</body>
</html>
